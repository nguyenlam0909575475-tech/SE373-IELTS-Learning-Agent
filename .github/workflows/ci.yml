name: CI Pipeline

on:
  push:
    branches: [ main, xac_dinh_nhiem_vu_phase_1, "feature/**", "feat/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check private files and common secrets
        run: |
          python -B scripts/check_repository.py
          python -B scripts/check_repository.py --history

      - name: Run Ruff Lint Check
        run: |
          ruff check .

      - name: Run Pytest Test Suite
        run: |
          pytest

      - name: Set up Node for frontend evidence checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check evidence highlighting
        run: node --test tests/test_frontend_evidence.cjs
